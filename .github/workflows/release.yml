name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_suffix: .exe
            package_name: agentdesk-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_suffix: ''
            package_name: agentdesk-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin_suffix: ''
            package_name: agentdesk-macos-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_suffix: ''
            package_name: agentdesk-linux-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "package-agentdesk"
          New-Item -ItemType Directory -Path $dir
          Copy-Item "target/${{ matrix.target }}/release/agentdesk-host.exe" "$dir/"
          Copy-Item "target/${{ matrix.target }}/release/agentdesk-viewer.exe" "$dir/"
          Copy-Item "target/${{ matrix.target }}/release/agentdesk-signal.exe" "$dir/"
          Copy-Item "README.md" "$dir/"
          Copy-Item "LICENSE" "$dir/"
          Compress-Archive -Path "$dir/*" -DestinationPath "${{ matrix.package_name }}"

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          DIR="package-agentdesk"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/agentdesk-host" "$DIR/"
          cp "target/${{ matrix.target }}/release/agentdesk-viewer" "$DIR/"
          cp "target/${{ matrix.target }}/release/agentdesk-signal" "$DIR/"
          cp README.md LICENSE "$DIR/"
          tar -czvf "${{ matrix.package_name }}" -C "$DIR" .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.package_name }}
